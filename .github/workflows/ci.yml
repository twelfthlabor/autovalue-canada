name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autovalue
          POSTGRES_PASSWORD: autovalue
          POSTGRES_DB: autovalue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autovalue -d autovalue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://autovalue:autovalue@localhost:5432/autovalue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build:data
      - run: python analysis/etl_to_postgres.py
      - run: python analysis/run_sql.py
      - run: python aws/check_parity.py
      - run: npm run model:benchmark
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
