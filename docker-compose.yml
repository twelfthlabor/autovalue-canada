name: autovalue-canada
services:
  db:
    # Same major version as AWS RDS for PostgreSQL used in production target
    # (see docs/ARCHITECTURE.md). Local Docker maps to RDS with no SQL changes.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autovalue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autovalue}
      POSTGRES_DB: ${POSTGRES_DB:-autovalue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-autovalue} -d $${POSTGRES_DB:-autovalue}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
